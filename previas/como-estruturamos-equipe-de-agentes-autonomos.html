<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Como estruturamos uma equipe de agentes autônomos</title>
  <style>
    :root {
      --page: #d8d3c8;
      --surface: #fff;
      --line: #efefef;
      --text: #111;
      --muted: #737373;
      --blue: #0095f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 38px 18px;
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .post {
      width: min(420px, calc(100vw - 36px));
      overflow: hidden;
      border: 1px solid #dbdbdb;
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.14);
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      overflow: hidden;
      border-radius: 50%;
      background: #eee;
    }

    .avatar img,
    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .username {
      overflow: hidden;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hidden {
      display: none;
    }

    .verified {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      color: var(--blue);
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .icon-button svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .media {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #f7f1e5;
      cursor: grab;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .media.dragging {
      cursor: grabbing;
    }

    .track {
      display: flex;
      height: 100%;
      transition: transform 260ms ease;
      will-change: transform;
    }

    .slide {
      min-width: 100%;
      height: 100%;
      background: #f7f1e5;
    }

    .slide img {
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .counter {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.62);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
    }

    .hit {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 2;
      width: 33.333%;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .hit.prev {
      left: 0;
    }

    .hit.next {
      right: 0;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 4px;
      height: 18px;
      padding-top: 8px;
      background: var(--surface);
    }

    .dot {
      width: 6px;
      height: 6px;
      border: 0;
      border-radius: 50%;
      background: #c7c7c7;
      cursor: pointer;
    }

    .dot.active {
      background: var(--blue);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 40px;
      padding: 4px 12px 8px;
      background: var(--surface);
    }

    .actions .icon-button {
      width: 26px;
      height: 26px;
    }

    .actions .icon-button svg {
      width: 25px;
      height: 25px;
    }

    .save {
      margin-left: auto;
    }

    .likes,
    .caption,
    .time {
      background: var(--surface);
      font-size: 13px;
      line-height: 1.35;
    }

    .likes {
      padding: 0 12px 4px;
      font-weight: 600;
    }

    .caption {
      padding: 0 12px 2px;
      white-space: pre-wrap;
    }

    .caption strong {
      font-weight: 600;
    }

    .caption .more,
    .time {
      color: var(--muted);
    }

    .time {
      padding: 4px 12px 14px;
      font-size: 11px;
      line-height: 1;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      body {
        display: block;
        min-height: 100vh;
        padding: 0;
        background: var(--surface);
      }

      .post {
        width: 100vw;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .post-header {
        height: 50px;
      }

      .media {
        width: 100vw;
      }
    }
  </style>
</head>

  <script>
    const slides = ["../saidas/stories/como-estruturamos-equipe-de-agentes-autonomos/story-01.jpg"];
    const track = document.getElementById("track");
    const dots = document.getElementById("dots");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const media = document.getElementById("media");
    let current = 0;
    let startX = 0;
    let currentX = 0;
    let dragging = false;
    let didDrag = false;

    slides.forEach((src, index) => {
      const slide = document.createElement("div");
      slide.className = "slide";
      const img = document.createElement("img");
      img.src = src;
      img.alt = `Slide ${index + 1}`;
      slide.appendChild(img);
      track.appendChild(slide);

      const dot = document.createElement("button");
      dot.className = "dot";
      dot.type = "button";
      dot.setAttribute("aria-label", `Ir para slide ${index + 1}`);
      dot.addEventListener("click", () => {
        current = index;
        render();
      });
      dots.appendChild(dot);
    });

    function render() {
      track.style.transition = "transform 260ms ease";
      track.style.transform = `translateX(${-current * 100}%)`;
      counter.textContent = `${current + 1}/${slides.length}`;
      [...dots.children].forEach((dot, index) => dot.classList.toggle("active", index === current));
      prev.disabled = current === 0;
      next.disabled = current === slides.length - 1;
    }

    function go(delta) {
      current = Math.max(0, Math.min(slides.length - 1, current + delta));
      render();
    }

    function handleTap(delta) {
      if (didDrag) {
        didDrag = false;
        return;
      }
      go(delta);
    }

    prev.addEventListener("click", () => handleTap(-1));
    next.addEventListener("click", () => handleTap(1));

    media.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      dragging = true;
      didDrag = false;
      startX = event.clientX;
      currentX = event.clientX;
      track.style.transition = "none";
      media.classList.add("dragging");
      media.setPointerCapture(event.pointerId);
    });

    media.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      currentX = event.clientX;
      const distance = currentX - startX;
      if (Math.abs(distance) > 8) didDrag = true;
      const width = media.clientWidth || 1;
      const edgeResistance = (current === 0 && distance > 0) || (current === slides.length - 1 && distance < 0) ? 0.28 : 1;
      track.style.transform = `translateX(${(-current * 100) + ((distance * edgeResistance / width) * 100)}%)`;
    });

    function finishDrag(event) {
      if (!dragging) return;
      const distance = currentX - startX;
      dragging = false;
      media.classList.remove("dragging");
      if (event.pointerId !== undefined && media.hasPointerCapture(event.pointerId)) media.releasePointerCapture(event.pointerId);
      if (Math.abs(distance) > 45) {
        go(distance < 0 ? 1 : -1);
      } else {
        render();
      }
    }

    media.addEventListener("pointerup", finishDrag);
    media.addEventListener("pointercancel", finishDrag);
    render();
  </script>
